  function setLocationCard(open){locationCard.hidden=!open;openLocation.setAttribute('aria-expanded',String(open));if(!open){markMode=false;canvas.classList.remove('mark-mode');stopGeolocation()}}
  function stopGeolocation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;geoStatus.textContent='实时定位已停止'+(document.getElementById('geo-coords').textContent==='—'?'':' · 显示上次位置');geoStatus.classList.remove('error')}geoButton.textContent='开启实时定位';openLocation.classList.remove('live')}
  function setGeoError(message){stopGeolocation();geoStatus.textContent=message;geoStatus.classList.add('error')}
  function startGeolocation(){if(!navigator.geolocation){setGeoError('当前浏览器不支持定位');return}if(!window.isSecureContext){setGeoError('定位需要 HTTPS 页面或受信任的本地环境');return}geoStatus.textContent='正在获取设备位置…';geoStatus.classList.remove('error');geoButton.textContent='停止实时定位';try{watchId=navigator.geolocation.watchPosition(position=>{const {latitude,longitude,accuracy}=position.coords;document.getElementById('geo-coords').textContent=latitude.toFixed(5)+', '+longitude.toFixed(5);document.getElementById('geo-accuracy').textContent='约 '+Math.round(accuracy)+' 米';document.getElementById('geo-time').textContent=new Date(position.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});geoStatus.textContent='设备位置实时更新中';geoStatus.classList.remove('error');openLocation.classList.add('live')},error=>{const messages={1:'定位权限被拒绝，请在浏览器设置中允许定位',2:'暂时无法取得设备位置，请检查定位服务',3:'获取位置超时，请重试'};setGeoError(messages[error.code]||'定位暂时不可用，请重试')},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}catch{setGeoError('定位启动失败，请检查浏览器权限')}}
  openLocation.addEventListener('click',()=>{setLocationCard(locationCard.hidden);if(!locationCard.hidden)detail.hidden=true});document.getElementById('close-location').addEventListener('click',()=>setLocationCard(false));geoButton.addEventListener('click',()=>watchId===null?startGeolocation():stopGeolocation());
  markButton.addEventListener('click',()=>{markMode=true;canvas.classList.add('mark-mode');manualStatus.textContent='请点击楼层图上你所在的位置';markButton.textContent='等待选择图上位置…';viewport.focus()});
  canvas.addEventListener('click',event=>{if(!markMode||event.target.closest('.pin'))return;const rect=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(100,(event.clientX-rect.left)/rect.width*100)),y=Math.max(0,Math.min(100,(event.clientY-rect.top)/rect.height*100));selfPin.style.left=x+'%';selfPin.style.top=y+'%';selfPin.hidden=false;markMode=false;canvas.classList.remove('mark-mode');manualStatus.textContent='图上位置已手动标记；点击按钮可重新标记';markButton.textContent='重新标记图上位置';clearButton.hidden=false});
  clearButton.addEventListener('click',()=>{selfPin.hidden=true;markMode=false;canvas.classList.remove('mark-mode');manualStatus.textContent='图上标记已清除';markButton.textContent='在图上手动标记';clearButton.hidden=true});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&markMode){markMode=false;canvas.classList.remove('mark-mode');manualStatus.textContent='已取消标记';markButton.textContent=selfPin.hidden?'在图上手动标记':'重新标记图上位置'}});window.addEventListener('pagehide',stopGeolocation);
  </script>
</body>
</html>
